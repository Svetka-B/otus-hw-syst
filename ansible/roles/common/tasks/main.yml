---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name:
      - curl
      - vim
      - git
      - unzip
      - rsync
      - htop
      - net-tools
      - acl
      - ca-certificates
    state: present

- name: Set timezone
  community.general.timezone:
    name: Europe/Moscow