---
# ---- Блок подготовки (выполняется на всех узлах) ----
- block:
    - name: Install MySQL 8 Server and Shell
      apt:
        name:
          - mysql-server
          - mysql-shell
          - mysql-common
        state: present
      notify: restart mysql

    - name: Install Python MySQL connector for Ansible
      apt:
        name: python3-pymysql
        state: present

    - name: Create MySQL configuration directory if not exists
      file:
        path: /etc/mysql/mysql.conf.d
        state: directory
        owner: root
        group: root
        mode: 0755

    - name: Remove all custom config files except mysqld.cnf
      find:
        paths: /etc/mysql/mysql.conf.d/
        patterns: '*.cnf'
        excludes: 'mysqld.cnf'
        file_type: file
      register: custom_configs

    - name: Delete custom config files (except mysqld.cnf)
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ custom_configs.files }}"
      when: custom_configs.files | length > 0

    - name: Ensure bind-address is set to 0.0.0.0 in mysqld.cnf
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^#?\s*bind-address\s*='
        line: 'bind-address = 0.0.0.0'
        backup: yes
      notify: restart mysql

    - name: Ensure mysqlx-bind-address is set to 0.0.0.0 in mysqld.cnf
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^#?\s*mysqlx-bind-address\s*='
        line: 'mysqlx-bind-address = 0.0.0.0'
        backup: yes
      notify: restart mysql

    - name: Deploy custom MySQL config (without Group Replication parameters)
      template:
        src: my.cnf.j2
        dest: /etc/mysql/mysql.conf.d/zzz-custom.cnf
        owner: root
        group: root
        mode: 0644
      notify: restart mysql

    - name: Ensure ufw allows MySQL ports from cluster subnet
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
        from_ip: "192.168.1.0/24"
      loop:
        - "{{ mysql_port }}"
        - "33061"
      when: ansible_facts.get('ufw', {}).get('enabled', False)
      ignore_errors: yes

    - name: Flush handlers to restart MySQL immediately
      meta: flush_handlers

    - name: Ensure MySQL is running
      service:
        name: mysql
        state: started
        enabled: yes

    - name: Wait for MySQL to accept connections (using external IP)
      wait_for:
        port: "{{ mysql_port }}"
        host: "{{ ansible_default_ipv4.address }}"
        timeout: 30

    - name: Verify MySQL listens on 0.0.0.0 (if not, restart again)
      shell: |
        ss -tlnp | grep -E '0.0.0.0:{{ mysql_port }}'
      register: listen_check
      until: listen_check.rc == 0
      retries: 3
      delay: 10
      changed_when: false
      failed_when: false

    - name: Restart MySQL if it doesn't listen on 0.0.0.0
      service:
        name: mysql
        state: restarted
      when: listen_check.rc != 0

    - name: Wait again after second restart
      wait_for:
        port: "{{ mysql_port }}"
        host: "{{ ansible_default_ipv4.address }}"
        timeout: 30
      when: listen_check.rc != 0

    - name: Disable super_read_only after restarts (with retry)
      shell: |
        mysql -u root -e "SET GLOBAL super_read_only=OFF;"
        mysql -u root -e "SHOW VARIABLES LIKE 'super_read_only';"
      register: disable_super_read_only
      until: "'OFF' in disable_super_read_only.stdout"
      retries: 5
      delay: 3
      failed_when: false
      changed_when: "'Query OK' in disable_super_read_only.stdout"

    - name: Install Group Replication plugin
      shell: |
        mysql -u root -e "INSTALL PLUGIN group_replication SONAME 'group_replication.so';" 2>/dev/null || echo "Plugin already installed"
      register: install_plugin
      changed_when: "'Query OK' in install_plugin.stdout"
      failed_when: false

    - name: Set binlog_transaction_dependency_tracking to WRITESET
      shell: mysql -u root -e "SET GLOBAL binlog_transaction_dependency_tracking = 'WRITESET';"
      register: set_writeset
      changed_when: "'Query OK' in set_writeset.stdout"
      failed_when: false

    # ---- Создание пользователей и базы данных ----
    - name: Create cluster administration user
      mysql_user:
        name: cluster_admin
        host: '%'
        password: "{{ mysql_root_password }}"
        priv: '*.*:ALL,GRANT'
        state: present
        login_user: root
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Grant replication privileges
      shell: mysql -u root -e "GRANT REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO 'cluster_admin'@'%'; FLUSH PRIVILEGES;"
      register: grant_repl
      changed_when: "'Query OK' in grant_repl.stdout"
      failed_when: false

    - name: Drop anonymous users
      mysql_user:
        name: ''
        host_all: yes
        state: absent
        login_user: root
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Flush privileges
      shell: mysql -u root -e "FLUSH PRIVILEGES;"

    - name: Ensure application database exists
      mysql_db:
        name: "{{ django_db_name }}"
        state: present
        login_user: root
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Ensure application database user exists
      mysql_user:
        name: "{{ django_db_user }}"
        host: '%'
        password: "{{ django_db_password }}"
        priv: "{{ django_db_name }}.*:ALL"
        state: present
        login_user: root
        login_unix_socket: /var/run/mysqld/mysqld.sock

  tags: prepare

# ---- Блок создания кластера (выполняется только на db-1) ----
- block:
    - name: Check cluster status (only on db-1)
      shell: |
        mysqlsh --user=cluster_admin --password={{ mysql_root_password }} \
                --host=127.0.0.1 --port={{ mysql_port }} \
                --execute "import mysqlsh; shell.connect('cluster_admin:{{ mysql_root_password }}@127.0.0.1:{{ mysql_port }}'); cluster = dba.get_cluster(); print(cluster.status())" 2>/dev/null || echo '{"status":"NOT_EXISTS"}'
      register: cluster_status
      when: inventory_hostname == 'db-1'
      changed_when: false
      failed_when: false

    - name: Set fact cluster_exists
      set_fact:
        cluster_exists: "{{ 'OK' in cluster_status.stdout | default('') }}"
      when: inventory_hostname == 'db-1'

    - name: Propagate cluster_exists to other hosts
      set_fact:
        cluster_exists: "{{ hostvars['db-1']['cluster_exists'] | default(False) }}"
      when: inventory_hostname != 'db-1'

    - name: Reset Group Replication state and drop old metadata (only if no cluster)
      shell: |
        mysql -u root -e "
          STOP GROUP_REPLICATION;
          RESET SLAVE ALL;
          RESET MASTER;
          DROP DATABASE IF EXISTS mysql_innodb_cluster_metadata;
          DROP DATABASE IF EXISTS mysql_innodb_cluster_metadata_previous;
        "
      when: inventory_hostname == 'db-1' and not cluster_exists
      ignore_errors: yes

    - name: Set recovery credentials (only on db-1 if no cluster)
      shell: |
        mysql -u root -e "CHANGE REPLICATION SOURCE TO SOURCE_USER='cluster_admin', SOURCE_PASSWORD='{{ mysql_root_password }}' FOR CHANNEL 'group_replication_recovery';"
      when: inventory_hostname == 'db-1' and not cluster_exists
      register: set_recovery
      changed_when: "'Query OK' in set_recovery.stdout"
      ignore_errors: yes

    - name: Set group_replication global variables (only on db-1 if no cluster)
      shell: |
        mysql -u root -e "
          SET GLOBAL group_replication_group_name = '{{ mysql_group_name }}';
          SET GLOBAL group_replication_local_address = '{{ ansible_default_ipv4.address }}:33061';
          SET GLOBAL group_replication_group_seeds = '{{ mysql_cluster_seed_hosts }}';
          SET GLOBAL group_replication_ip_whitelist = '192.168.1.0/24,127.0.0.1';
          SET GLOBAL group_replication_start_on_boot = OFF;
        "
      when: inventory_hostname == 'db-1' and not cluster_exists
      ignore_errors: yes

    - name: Create InnoDB cluster (only on db-1 if no cluster)
      shell: |
        mysqlsh --user=cluster_admin --password={{ mysql_root_password }} \
                --host=127.0.0.1 --port={{ mysql_port }} \
                --execute "import mysqlsh; shell.connect('cluster_admin:{{ mysql_root_password }}@127.0.0.1:{{ mysql_port }}'); dba.create_cluster('myCluster', {'localAddress': '{{ ansible_default_ipv4.address }}:33061', 'communicationStack': 'XCOM'});"
      when: inventory_hostname == 'db-1' and not cluster_exists
      register: cluster_created

    - name: Wait a moment for cluster to stabilize
      pause:
        seconds: 10
      when: inventory_hostname == 'db-1' and cluster_created is changed

    - name: Re-check cluster status after creation (only on db-1)
      shell: |
        mysqlsh --user=cluster_admin --password={{ mysql_root_password }} \
                --host=127.0.0.1 --port={{ mysql_port }} \
                --execute "import mysqlsh; shell.connect('cluster_admin:{{ mysql_root_password }}@127.0.0.1:{{ mysql_port }}'); cluster = dba.get_cluster(); print(cluster.status())" 2>/dev/null || echo '{"status":"NOT_EXISTS"}'
      register: cluster_status_after
      when: inventory_hostname == 'db-1' and cluster_created is changed

    - name: Update cluster_exists after creation
      set_fact:
        cluster_exists: "{{ 'OK' in cluster_status_after.stdout | default('') }}"
      when: inventory_hostname == 'db-1' and cluster_created is changed

    - name: Propagate updated cluster_exists to other hosts
      set_fact:
        cluster_exists: "{{ hostvars['db-1']['cluster_exists'] | default(False) }}"
      when: inventory_hostname != 'db-1'

    - name: Wait for secondary nodes to be reachable (port 3306)
      wait_for:
        port: "{{ mysql_port }}"
        host: "{{ hostvars[item]['ansible_host'] }}"
        timeout: 30
      loop: "{{ groups['db'] | difference(['db-1']) }}"
      when: inventory_hostname == 'db-1' and cluster_exists
      ignore_errors: yes

    - name: Verify that cluster_admin can connect to secondary nodes
      shell: |
        mysql -u cluster_admin -p{{ mysql_root_password }} -h {{ hostvars[item]['ansible_host'] }} -P {{ mysql_port }} -e "SELECT 1;"
      loop: "{{ groups['db'] | difference(['db-1']) }}"
      when: inventory_hostname == 'db-1' and cluster_exists
      register: connection_check
      until: "'1' in connection_check.stdout"
      retries: 3
      delay: 5
      ignore_errors: yes

    - name: Add secondary nodes to cluster (run on db-1) with retries
      shell: |
        mysqlsh --user=cluster_admin --password={{ mysql_root_password }} \
                --host=127.0.0.1 --port={{ mysql_port }} \
                --execute "import mysqlsh; shell.connect('cluster_admin:{{ mysql_root_password }}@127.0.0.1:{{ mysql_port }}'); cluster = dba.get_cluster(); cluster.add_instance('cluster_admin:{{ mysql_root_password }}@{{ hostvars[item]['ansible_host'] }}:{{ mysql_port }}', {'password': '{{ mysql_root_password }}', 'recoveryMethod': 'clone'});"
      loop: "{{ groups['db'] | difference(['db-1']) }}"
      when: inventory_hostname == 'db-1' and cluster_exists
      register: add_instances
      until: add_instances is success
      retries: 3
      delay: 10
      ignore_errors: yes

    - name: Display final cluster status (only on db-1)
      debug:
        msg: "Cluster status:\n{{ cluster_status_after.stdout if cluster_created is changed else cluster_status.stdout }}"
      when: inventory_hostname == 'db-1'

  tags: cluster
