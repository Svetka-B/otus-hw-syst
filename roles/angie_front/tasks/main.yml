---
- name: Install prerequisites for Angie repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Download Angie signing key
  ansible.builtin.get_url:
    url: https://angie.software/keys/angie-signing.gpg
    dest: /usr/share/keyrings/angie-archive-keyring.gpg
    mode: "0644"
  when: ansible_os_family == "Debian"

- name: Add Angie repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/angie-archive-keyring.gpg] https://download.angie.software/angie/ubuntu/22.04 jammy main"
    state: present
    filename: angie
  when:
    - ansible_os_family == "Debian"
    - ansible_distribution == "Ubuntu"
    - ansible_distribution_major_version == "22"

- name: Install Angie
  ansible.builtin.apt:
    name: angie
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Deploy Angie frontend config
  ansible.builtin.template:
    src: "front.conf.j2"
    dest: "/etc/angie/http.d/frontend.conf"
    owner: root
    group: root
    mode: "0644"
  notify: reload angie front

- name: Ensure Angie service is enabled and started
  ansible.builtin.systemd:
    name: "{{ angie_front_service_name }}"
    enabled: true
    state: started