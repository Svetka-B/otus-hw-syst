---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Ensure Docker apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: ansible_os_family == "Debian"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: ansible_os_family == "Debian"

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
  when: ansible_os_family == "Debian"

- name: Install Docker engine and compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Ensure docker service is enabled and started
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Ensure debug compose directory exists
  ansible.builtin.file:
    path: "{{ app_runtime_compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy debug docker compose file
  ansible.builtin.template:
    src: debug-compose.yml.j2
    dest: "{{ app_runtime_compose_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Run debug backend containers
  ansible.builtin.command:
    cmd: docker compose up -d
  args:
    chdir: "{{ app_runtime_compose_dir }}"